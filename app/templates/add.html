<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add items</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4 d-flex justify-content-center align-items-center" style="min-height: 100vh; background-color: #f4f4f9;">

    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 500px; background: white;">
        <h2 class="mb-4 text-center">Add New Item</h2>
        
        {% if error %}
            <div class="alert alert-danger text-center" role="alert">
                {{ error }}
            </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('main.add') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Item Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            
            <div class="mb-3">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quantity" name="quantity" min="0" required>
            </div>
            
            <div class="mb-3">
                <label for="price" class="form-label">Price ($)</label>
                <input type="number" step="0.01" class="form-control" id="price" name="price" min="0" required>
            </div>
            
            <div class="d-flex gap-2 pt-2">
                <button type="submit" class="btn btn-primary flex-grow-1">Add Item</button>
                <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
