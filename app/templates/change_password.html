<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4 d-flex justify-content-center align-items-center" style="height: 100vh; background-color: #f4f4f9;">

    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 450px; background: white;">
        <h3 class="text-center mb-4">Change Password</h3>

        {% if error %}
            <div class="alert alert-danger text-center" role="alert">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="alert alert-success text-center" role="alert">
                {{ success }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('main.change_password') }}">
            <div class="mb-3">
                <label for="current_password" class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-2">Update Password</button>
            <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary w-100">Back to Inventory</a>
        </form>
    </div>

</body>
</html>
