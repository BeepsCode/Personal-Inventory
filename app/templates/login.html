<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Init Session</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .title { margin-bottom: 20px; color: #333; text-align: center; }
        .process-form label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .process-form input[type="text"], .process-form input[type="password"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
    </style>
</head>
<body>

  <div class="login-container">
    <h2 class="title">Login Form</h2>

    <form method="POST" class="process-form" action="{{ url_for('main.login') }}">

      <label for="username">Enter a valid username:</label>
      <input type="text" name="username" placeholder="Username" required />

      <label for="password">Enter the password:</label>
      <input type="password" name="password" placeholder="Password" required />
      
      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
      
      <input type="submit" class="btn btn-primary" value="Login" />
      <div class="text-center mt-3">
    <a href="{{ url_for('main.register') }}" style="color: #007bff; text-decoration: none; font-size: 14px;">
        Don't have an account? Register here
    </a>
</div>
    </form>
  </div>
</body>
</html>
