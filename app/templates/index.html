<html>
    <head>
        <title>Inventory</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>

    <body class="p-4">
        <h2 class="mb-4">Personal Inventory</h2>

    <div class="mb-3 d-flex justify-content-between align-items-center flex-wrap gap-3">
        
        <div class="d-flex align-items-center gap-3">
            <a href="{{ url_for('main.add') }}" class="btn btn-primary">Add Item</a>
            <span class="fs-5 text-dark">Welcome, <strong>{{ nombre }}</strong>!</span>
        </div>
        
        <div>
            <a href="{{ url_for('main.change_password') }}" class="btn btn-sm btn-primary me-2">Change Password</a>
            <a href="{{ url_for('main.logout') }}" class="btn btn-sm btn-danger">Logout</a>
        </div>
        
    </div>

    <form method="GET" action="{{ url_for('main.home') }}" class="mb-3">
        {% if sort_by %}
            <input type="hidden" name="sort" value="{{ sort_by }}">
        {% endif %}
        <input type="text" name="search" placeholder="Search by name..." value="{{ search }}" class="form-control">
    </form>
    
    <div class="mb-3">
        <a href="{{ url_for('main.home', sort='id', search=search) }}" class="btn btn-secondary btn-sm">Sort by ID</a>
        <a href="{{ url_for('main.home', sort='name', search=search) }}" class="btn btn-secondary btn-sm">Sort by Name</a>
        <a href="{{ url_for('main.home', sort='quantity', search=search) }}" class="btn btn-secondary btn-sm">Sort by Quantity</a>
        <a href="{{ url_for('main.home', sort='price', search=search) }}" class="btn btn-secondary btn-sm">Sort by Price</a>
    </div>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item[0] }}</td>
                    <td>{{ item[1] }}</td>
                    <td>{{ item[2] }}</td>
                    <td>{{ item[3] }}</td>
                    <td>
                        <a href="{{ url_for('main.edit', item_id=item[0]) }}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{{ url_for('main.delete', item_id=item[0]) }}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </body>
    </html>
