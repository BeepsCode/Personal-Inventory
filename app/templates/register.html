<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Account</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .register-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .title { margin-bottom: 20px; color: #333; text-align: center; }
        .process-form label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .process-form input[type="text"], .process-form input[type="password"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-success:hover { background-color: #218838; }
        .error-msg { color: #dc3545; background-color: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; text-align: center; }
        .login-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

  <div class="register-container">
    <h2 class="title">Register Form</h2>
    
    <!-- Si la base de datos detecta un error o usuario repetido, lo muestra aquí -->
    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}
    
    <form method="POST" class="process-form" action="{{ url_for('main.register') }}">

      <label for="username">Choose a username:</label>
      <input type="text" name="username" placeholder="New Username" required />

      <label for="password">Choose a password:</label>
      <input type="password" name="password" placeholder="New Password" required />
      
      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
      
      <input type="submit" class="btn btn-success" value="Create Account" />
    </form>

    <a href="{{ url_for('main.login') }}" class="login-link">Already have an account? Log in here</a>
  </div>

</body>
</html>
